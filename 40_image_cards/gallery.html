<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>効果の一覧</title>
<link rel="stylesheet" href="style.css">
<style>html,body{overflow:auto;height:auto}#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px;padding:6px}
.cell{aspect-ratio:3/2;border-radius:10px}.cap{position:absolute;left:8px;bottom:6px;z-index:9;font:11px/1.2 sans-serif;color:rgba(255,255,255,.7)}.cell .word{font-size:clamp(1.4rem,15cqw,3rem)}</style></head><body>
<div id="g"></div>
<script src="lib/gsap.min.js"></script><script src="lib/tsparticles.bundle.min.js"></script>
<script src="data.js"></script><script src="defs.js"></script>
<script src="fx_core.js"></script><script src="fx_shapes1.js"></script><script src="fx_shapes2.js"></script>
<script>
// 全単語の効果を同時に流す一覧。?from=551&to=575 で範囲を指定
const q = new URLSearchParams(location.search), lo = +(q.get("from") || 551), hi = +(q.get("to") || 600), errs = [];
window.onerror = (m, s, l) => errs.push(m + " @" + String(s).split("/").pop() + ":" + l);
for (const w of WORDS.filter(w => +w.no >= lo && +w.no <= hi)) {
  const d = DEFS[w.no]; if (!d) continue;
  const cell = document.createElement("div"); cell.className = "stage cell";
  cell.innerHTML = `<div class="word"></div><div class="cap">${w.no} ${d.fx}</div>`;
  document.getElementById("g").appendChild(cell);
  try { new Stage(cell, cell.querySelector(".word")).play(d, w.word); } catch (e) { errs.push(w.no + " " + d.fx + ": " + e.message); }
}
setTimeout(() => { document.title = "errors:" + errs.length; document.body.dataset.errs = errs.join(" | "); }, 100);
</script></body></html>
