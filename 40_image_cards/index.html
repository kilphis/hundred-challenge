<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>金のフレーズ 単語帳 — Image Cards</title>
<link rel="stylesheet" href="style.css"></head><body>
<div id="app">
  <div class="stage" id="stage">
    <div class="word" id="word"></div>
    <div class="sub" id="sub"></div>
    <div class="hint" id="hint">SPACE でめくる</div>
  </div>
  <div class="chrome top">
    <div class="brand"><b>Golden Phrase</b> · Image Cards</div>
    <label class="pill">No. <input id="lo" type="number" value="551" min="401" max="700">〜<input id="hi" type="number" value="600" min="401" max="700"></label>
    <button class="pill" id="shuf">シャッフル</button>
    <button class="pill" id="go">開始</button>
    <span class="pill prog" id="prog"></span>
  </div>
  <div class="back hide" id="back"></div>
  <div class="chrome bottom">
    <button class="pill" id="prev"><kbd>←</kbd> 前</button>
    <button class="pill" id="flip"><kbd>Space</kbd> めくる</button>
    <button class="pill" id="replay"><kbd>R</kbd> もう一度</button>
    <button class="pill" id="next">次 <kbd>→</kbd></button>
  </div>
</div>
<script src="lib/gsap.min.js"></script>
<script src="lib/tsparticles.bundle.min.js"></script>
<script src="data.js"></script><script src="defs.js"></script>
<script src="fx_core.js"></script><script src="fx_shapes1.js"></script><script src="fx_shapes2.js"></script>
<script src="app.js"></script>
</body></html>
