[project]
name = "assetstack"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["pyyaml", "pillow", "pydantic"]
[project.optional-dependencies]
rembg = ["rembg"]
[project.scripts]
assetstack = "assetstack.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/assetstack"]
[dependency-groups]
dev = ["pytest"]
