<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゾンビ街のコンビニ</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee;
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; overflow: hidden; }
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas { display: block;  }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8,10,8,.86); }
  .overlay.hidden { display: none; }
  .panel { width: min(760px, 92vw); max-height: 92vh; overflow: auto; padding: 24px 28px; background: #1c211c;
    border: 2px solid #3d4a3a; border-radius: 10px; }
  h1 { margin: 0 0 4px; font-size: 26px; color: #b7e08a; }
  h2 { margin: 0 0 12px; font-size: 20px; }
  .sub { color: #9a9; font-size: 13px; margin-bottom: 16px; }
  .shift { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 10px 14px; margin: 8px 0; background: #262d25; border: 1px solid #3d4a3a; border-radius: 8px; cursor: pointer; }
  .shift:hover { background: #303a2e; }
  .shift.locked { opacity: .4; cursor: not-allowed; }
  .shift .t { font-weight: bold; }
  .shift .new { margin-left: 8px; font-size: 11px; font-weight: normal; color: #ffcc55; }
  .shift .d { font-size: 12px; color: #aab; margin-top: 2px; }
  .shift .tag { font-size: 12px; color: #b7e08a; white-space: nowrap; }
  .keys { font-size: 13px; color: #ccd; line-height: 1.8; margin-top: 14px; border-top: 1px solid #3d4a3a; padding-top: 10px; }
  kbd { background: #333; border: 1px solid #555; border-radius: 3px; padding: 0 5px; font-size: 12px; }
  .btn { display: inline-block; margin: 14px 10px 0 0; padding: 8px 18px; background: #3b5a2c; border-radius: 6px; cursor: pointer; }
  .btn:hover { background: #4b7238; }
  table { border-collapse: collapse; margin-top: 8px; }
  td { padding: 3px 14px 3px 0; }
  .goal { font-size: 16px; line-height: 1.7; color: #fff; }
  .goal b { color: #ffe680; }
  .brief h3 { margin: 14px 0 4px; font-size: 14px; color: #b7e08a; }
  .brief ol { margin: 0; padding-left: 22px; font-size: 13px; line-height: 1.7; color: #dde; }
  .brief .legend { font-size: 13px; line-height: 1.8; color: #ccd; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .go { margin-top: 16px; padding: 10px; text-align: center; background: #3b5a2c; border-radius: 6px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="title" class="overlay"><div class="panel">
    <h1>ゾンビ街のコンビニ</h1>
    <div class="sub">お客(ゾンビ)に見つからないように、バックヤードのカートで商品を運び、売り場の棚の欠けたところを補充して、シフトを乗り切れ。レジには店長ゾンビ。</div>
    <div id="shiftList"></div>
    <label style="font-size:12px;color:#aab;display:block;margin:6px 0"><input type="checkbox" id="devMode" onchange="setDevMode(this.checked)"> 開発者モード(全シフトを選べる)</label>
    <div class="keys">
      <kbd>WASD</kbd>/<kbd>矢印</kbd> 移動　<kbd>E</kbd>/<kbd>Space</kbd> 長押しで作業　<kbd>Q</kbd> 持ち物を床に置く(Eで拾える)　<kbd>P</kbd> 一時停止　<kbd>B</kbd> CPUがプレイ(開発用)　<kbd>C</kbd> 視点切替<br>
      ゾンビの視界(扇形)に入ると「?」が溜まり、満タンで「!」— 追いかけてくる。<br>
      棚の陰に隠れれば視線は通らない。<b>バックヤードに逃げ込めばセーフ</b>。捕まると3回で早退(シフト失敗)。<br>
      欠品・ホットスナック切れ・ゴミあふれは「クレーム」。クレームが規定数以内でシフトを終えれば合格。
    </div>
  </div></div>
  <div id="brief" class="overlay hidden"><div class="panel" id="briefBody"></div></div>
  <div id="result" class="overlay hidden"><div class="panel" id="resultBody"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="models/picks.js"></script><script src="models/set1.js"></script><script src="models/set2.js"></script><script src="models/manager.js"></script>
<script src="defs.js"></script>
<script src="map.js"></script>
<script src="sim.js"></script><script src="action.js"></script>
<script src="zombie.js"></script>
<script src="staff.js"></script>
<script src="tasks.js"></script>
<script src="deliver.js"></script>
<script src="hud.js"></script>
<script src="world3d.js"></script>
<script src="render3d.js"></script><script src="labels3d.js"></script>
<script src="bot.js"></script>
<script src="main.js"></script>
</body>
</html>
