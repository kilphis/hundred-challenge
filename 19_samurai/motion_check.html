<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>侍モーション確認</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#cfd3d8;font:14px/1.4 -apple-system,"Hiragino Sans",sans-serif;color:#222}
#ui{position:fixed;left:10px;top:10px;background:rgba(255,255,255,.88);padding:10px 12px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.2);max-width:300px}
#ui button{font:inherit;padding:5px 12px;margin:0 4px 6px 0;border:1px solid #556;border-radius:5px;background:#fff;cursor:pointer}
#ui button.on{background:#1b2a4a;color:#fff}
#ui label{display:block;margin-top:4px}
#ui input[type=range]{width:100%}
#info{font:12px monospace;margin-top:6px;color:#444;white-space:pre}
canvas{display:block}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="models/samurai.js"></script>
</head><body>
<div id="ui">
  <div id="btns"></div>
  <label><input type="checkbox" id="loopAtk" checked> attack を繰り返す</label>
  <label><input type="checkbox" id="flow" checked> 床を流す(足が滑らないか確認)</label>
  <label><input type="checkbox" id="pause"> 一時停止(下のスライダーで位相 t を動かす)</label>
  <label>位相 t <input type="range" id="tr" min="0" max="1" step="0.005" value="0"></label>
  <label>再生速度 <input type="range" id="sp" min="0.1" max="2" step="0.05" value="1"></label>
  <div id="info"></div>
</div>
<script>
(function(){
  const R=new THREE.WebGLRenderer({antialias:true});
  R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
  R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(R.domElement);
  const S=new THREE.Scene();S.background=new THREE.Color(0xcfd3d8);
  const cam=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,1,3000);cam.position.set(230,130,300);
  const oc=new THREE.OrbitControls(cam,R.domElement);oc.target.set(0,85,0);oc.update();
  // ライト(_3dkit/SPEC.md の描画設定)
  S.add(new THREE.HemisphereLight(0xfff6e8,0x4a4038,0.5));
  const d=new THREE.DirectionalLight(0xfff1dc,0.8);d.position.set(200,350,150);d.target.position.set(0,80,0);S.add(d,d.target);
  d.castShadow=true;d.shadow.mapSize.set(2048,2048);const sc=d.shadow.camera;sc.left=sc.bottom=-300;sc.right=sc.top=300;sc.near=1;sc.far=1200;d.shadow.bias=-0.0005;
  const p=new THREE.PointLight(0xffe2b8,0.3,1500);p.position.set(-150,120,200);S.add(p);
  // 床(格子)
  const gc=document.createElement('canvas');gc.width=gc.height=256;const g=gc.getContext('2d');
  g.fillStyle='#b9ae9c';g.fillRect(0,0,256,256);g.fillStyle='#a89d8b';g.fillRect(0,0,128,128);g.fillRect(128,128,128,128);
  g.strokeStyle='#6a6050';g.lineWidth=3;g.strokeRect(0,0,256,256);
  const gt=new THREE.CanvasTexture(gc);gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(12,12);gt.anisotropy=4;
  const TILE=100; // 1枚=100cm(格子 repeat 12 → 床 1200cm)
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),new THREE.MeshStandardMaterial({map:gt,roughness:.9}));
  fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;S.add(fl);
  const sam=window.MODELS.samurai();S.add(sam);
  const U=sam.userData,M=U.motions;
  let cur='idle',t=0;
  const btns=document.getElementById('btns');
  Object.keys(M).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{cur=n;t=0;mark()};b.dataset.n=n;btns.appendChild(b)});
  function mark(){[...btns.children].forEach(b=>b.classList.toggle('on',b.dataset.n===cur))}
  mark();
  const $=id=>document.getElementById(id);
  $('tr').oninput=()=>{t=Number($('tr').value)};
  let last=performance.now();
  (function loop(now){
    requestAnimationFrame(loop);
    const dt=Math.min((now-last)/1000,0.1);last=now;
    const m=M[cur],sp=Number($('sp').value);
    if(!$('pause').checked){
      t+=dt*sp/m.duration;
      if(m.loop)t%=1;else if(t>=1){if($('loopAtk').checked)t=0;else t=1}
      $('tr').value=t;
      if($('flow').checked&&m.speed)gt.offset.y-=m.speed*dt*sp/TILE;
    }
    U.setPose(cur,t);
    $('info').textContent=cur+'  duration '+m.duration+'s  loop '+m.loop+(m.speed?'  speed '+m.speed+'cm/s':'')+'\nt = '+t.toFixed(3);
    R.render(S,cam);
  })(performance.now());
  addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
})();
</script></body></html>
