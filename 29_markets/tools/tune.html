<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>29 数値調整</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f5f2; --surface: #fcfcfb; --line: #dddbd4; --grid: #ebe9e3;
  --text: #0b0b0b; --text2: #52514e; --muted: #85837c;
  --accent: #2a78d6; --accent-ink: #fff;
  --series: #2a78d6; --prev: #a9a79f;
  --ok-bg: #dff3e4; --ok-ink: #0e6b2b;
  --short-bg: #e2ecfa; --short-ink: #1d4f8f;
  --long-bg: #fde6d8; --long-ink: #9a3a0a;
  --changed: #fff3c4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --line: #34332f; --grid: #2a2926;
    --text: #fff; --text2: #c3c2b7; --muted: #8d8b82;
    --accent: #3987e5; --accent-ink: #fff;
    --series: #3987e5; --prev: #6b6962;
    --ok-bg: #173a22; --ok-ink: #8fe0a6;
    --short-bg: #172c47; --short-ink: #9cc4f5;
    --long-bg: #45240f; --long-ink: #f6b48c;
    --changed: #4a3f12;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --line: #34332f; --grid: #2a2926;
  --text: #fff; --text2: #c3c2b7; --muted: #8d8b82;
  --accent: #3987e5; --accent-ink: #fff;
  --series: #3987e5; --prev: #6b6962;
  --ok-bg: #173a22; --ok-ink: #8fe0a6;
  --short-bg: #172c47; --short-ink: #9cc4f5;
  --long-bg: #45240f; --long-ink: #f6b48c;
  --changed: #4a3f12;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px;
  border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 16px; margin: 0 12px 0 0; }
button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: wait; }
#status { color: var(--text2); font-size: 13px; }
main { display: grid; grid-template-columns: minmax(320px, 520px) 1fr; gap: 16px; padding: 16px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
h2 { font-size: 14px; margin: 0 0 8px; }
h3 { font-size: 13px; margin: 14px 0 4px; color: var(--text2); font-weight: 600; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.tabs button { padding: 4px 10px; font-size: 13px; }
.tabs button.on { background: var(--text); color: var(--surface); border-color: var(--text); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--grid); }
th { color: var(--text2); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.info { color: var(--muted); font-size: 12px; }
input[type=number] { width: 72px; font: inherit; padding: 2px 4px; text-align: right;
  background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
input.changed { background: var(--changed); }
.orig { color: var(--muted); font-size: 11px; margin-left: 4px; }
.pill { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 12px; }
.ok { background: var(--ok-bg); color: var(--ok-ink); }
.short { background: var(--short-bg); color: var(--short-ink); }
.long { background: var(--long-bg); color: var(--long-ink); }
.right { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
#chart { width: 100%; height: 280px; display: block; }
#chart text { font-size: 11px; fill: var(--text2); }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--text2); margin-top: 4px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--series); vertical-align: middle; margin-right: 4px; }
.legend i.p { border-top: 2px dashed var(--prev); }
#tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; font-size: 12px; display: none; z-index: 5; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
textarea { width: 100%; min-height: 140px; font: 12px/1.5 ui-monospace, Menlo, monospace;
  background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
.note { color: var(--muted); font-size: 12px; }
.err { color: var(--long-ink); white-space: pre-wrap; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>29 markets 数値調整</h1>
  <button id="run" class="primary">シミュレーション実行</button>
  <button id="reset">初期値に戻す</button>
  <span id="status">読み込み中…</span>
</header>
<main>
  <section>
    <h2>数値(defs.rs の値から変えた欄は黄色)</h2>
    <div class="tabs" id="tabs"></div>
    <div id="editor"></div>
  </section>
  <div class="right">
    <section>
      <h2>マーケットごとの所要時間 <span class="note">目標: 各 6〜9分、全体 27〜33分</span></h2>
      <div id="summary" class="note">まだ実行していない</div>
    </section>
    <section>
      <h2>所持金の推移</h2>
      <svg id="chart" role="img" aria-label="所持金の推移"></svg>
      <div class="legend"><span><i></i>今回</span><span><i class="p"></i>前回</span><span>縦線 = 次のマーケットを開けた時刻</span></div>
    </section>
    <section>
      <h2 id="qtitle">クエストごとの達成時刻</h2>
      <div id="quests" class="note">まだ実行していない</div>
    </section>
    <section>
      <h2>defs.rs に書き戻す用の差分</h2>
      <textarea id="diff" readonly></textarea>
      <div id="warn" class="err"></div>
    </section>
  </div>
</main>
<div id="tip"></div>
<script>
const $ = (id) => document.getElementById(id);
let defs = null;      // --dump-defs の値(初期値)
let tuning = null;    // 編集中の値
let last = null, prev = null;
let tab = 0;

const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const band = (sec, lo, hi) => sec < lo * 60 ? ["short", "短い"] : sec > hi * 60 ? ["long", "長い"] : ["ok", "目標内"];
const clone = (o) => JSON.parse(JSON.stringify(o));

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", body: JSON.stringify(body), headers: { "Content-Type": "application/json" } } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

// tuning の欄と defs の同じ欄を [路, 値] の一覧にする(差分と編集表で使う)
function fields(m, d) {
  const f = [];
  m.items.forEach((x, i) => f.push({ sec: "品の値段", label: x.name, get: () => x.price, set: (v) => (x.price = v), orig: d?.items[i]?.price }));
  m.sources.forEach((x, i) => {
    f.push({ sec: "原料の建物", label: x.name, key: "cost", get: () => x.cost, set: (v) => (x.cost = v), orig: d?.sources[i]?.cost });
    f.push({ sec: "原料の建物", label: x.name, key: "unlock", get: () => x.unlock, set: (v) => (x.unlock = v), orig: d?.sources[i]?.unlock });
  });
  m.plants.forEach((x, i) => {
    f.push({ sec: "加工所", label: x.name, key: "cost", get: () => x.cost, set: (v) => (x.cost = v), orig: d?.plants[i]?.cost });
    f.push({ sec: "加工所", label: x.name, key: "unlock", get: () => x.unlock, set: (v) => (x.unlock = v), orig: d?.plants[i]?.unlock });
  });
  m.quests.forEach((x, i) => f.push({ sec: "クエスト", label: `${i + 1}: ${x.item}`, get: () => x.count, set: (v) => (x.count = v), orig: d?.quests[i]?.count }));
  for (const [k, name] of [["road_cost", "道"], ["farmer_cost", "作業員"], ["carrier_cost", "運び人"]])
    f.push({ sec: "その他", label: name, key: k, get: () => m[k], set: (v) => (m[k] = v), orig: d?.[k] });
  if (m.river) f.push({ sec: "その他", label: m.river.worker, key: "river.cost", get: () => m.river.cost, set: (v) => (m.river.cost = v), orig: d?.river?.cost });
  return f;
}

function input(fl) {
  const el = document.createElement("input");
  el.type = "number"; el.min = 0; el.value = fl.get();
  const mark = () => el.classList.toggle("changed", fl.get() !== fl.orig);
  el.oninput = () => { const v = parseInt(el.value, 10); if (!isNaN(v) && v >= 0) { fl.set(v); mark(); renderDiff(); } };
  mark();
  el.title = `初期値 ${fl.orig}`;
  return el;
}

function renderTabs() {
  $("tabs").innerHTML = "";
  tuning.markets.forEach((m, i) => {
    const b = document.createElement("button");
    b.textContent = m.name; b.className = i === tab ? "on" : "";
    b.onclick = () => { tab = i; renderTabs(); renderEditor(); renderQuests(); };
    $("tabs").append(b);
  });
}

function table(head, rows) {
  const t = document.createElement("table");
  t.innerHTML = "<tr>" + head.map((h) => `<th class="${h.num ? "num" : ""}">${h.t}</th>`).join("") + "</tr>";
  for (const cells of rows) {
    const tr = document.createElement("tr");
    for (const c of cells) {
      const td = document.createElement("td");
      if (c instanceof Node) { td.className = "num"; td.append(c); } else if (c && c.info) { td.className = "info"; td.textContent = c.info; } else td.textContent = c;
      tr.append(td);
    }
    t.append(tr);
  }
  return t;
}

function renderEditor() {
  const m = tuning.markets[tab], d = defs.markets.find((x) => x.name === m.name);
  const f = fields(m, d);
  const by = (sec) => f.filter((x) => x.sec === sec);
  const ed = $("editor"); ed.innerHTML = "";
  const h = (t) => { const e = document.createElement("h3"); e.textContent = t; ed.append(e); };
  h("品の値段(0 は売れない)");
  ed.append(table([{ t: "品" }, { t: "値段", num: 1 }], by("品の値段").map((x) => [x.label, input(x)])));
  h("原料の建物");
  const src = by("原料の建物");
  ed.append(table([{ t: "建物" }, { t: "作る物" }, { t: "費用", num: 1 }, { t: "解放(クエスト番号)", num: 1 }],
    m.sources.map((s, i) => [s.name, { info: s.info || "" }, input(src[2 * i]), input(src[2 * i + 1])])));
  h("加工所");
  const pl = by("加工所");
  ed.append(table([{ t: "加工所" }, { t: "レシピ" }, { t: "費用", num: 1 }, { t: "解放", num: 1 }],
    m.plants.map((s, i) => [s.name, { info: s.info || "" }, input(pl[2 * i]), input(pl[2 * i + 1])])));
  h("クエスト(個数)");
  ed.append(table([{ t: "#" }, { t: "品" }, { t: "個数", num: 1 }], by("クエスト").map((x, i) => [i + 1, m.quests[i].item, input(x)])));
  h("作業員・運び人・道");
  ed.append(table([{ t: "項目" }, { t: "費用", num: 1 }], by("その他").map((x) => [x.label, input(x)])));
  const note = document.createElement("p");
  note.className = "note";
  note.textContent = "解放 = そのクエスト番号(0 始まり)に着いたら建てられる。0 なら最初から。";
  ed.append(note);
}

function renderDiff() {
  const lines = [];
  tuning.markets.forEach((m) => {
    const d = defs.markets.find((x) => x.name === m.name);
    const ch = fields(m, d).filter((x) => x.get() !== x.orig);
    if (!ch.length) return;
    lines.push(`## ${m.name}`);
    for (const x of ch) lines.push(`- ${x.sec} ${x.label}${x.key && x.sec !== "その他" ? " " + x.key : x.key ? " (" + x.key + ")" : ""}: ${x.orig} → ${x.get()}`);
    lines.push("");
  });
  $("diff").value = lines.length ? lines.join("\n") : "(defs.rs から変えた数値はない)";
}

function renderSummary() {
  if (!last) return;
  const pm = (name) => prev?.markets.find((x) => x.name === name);
  let h = `<table><tr><th>マーケット</th><th class="num">所要</th><th>目標 6〜9分</th><th class="num">前回</th><th class="num">終了時の所持金</th></tr>`;
  for (const m of last.markets) {
    const [c, l] = m.done ? band(m.dur, 6, 9) : ["long", "打ち切り"];
    const p = pm(m.name);
    h += `<tr><td>${esc(m.name)}</td><td class="num">${mmss(m.dur)}</td><td><span class="pill ${c}">${l}</span></td>` +
      `<td class="num">${p ? mmss(p.dur) : "—"}</td><td class="num">${m.money_end}円</td></tr>`;
  }
  const [c, l] = band(last.total, 27, 33);
  h += `<tr><th>全体</th><th class="num">${mmss(last.total)}</th><td><span class="pill ${c}">${l}(27〜33分)</span></td>` +
    `<td class="num">${prev ? mmss(prev.total) : "—"}</td><td></td></tr></table>`;
  if (last.markets.length < tuning.markets.length) h += `<p class="err">${tuning.markets.length - last.markets.length} マーケットが開けられなかった</p>`;
  h += `<p class="note">計算 ${last.elapsed ?? "?"} 秒</p>`;
  $("summary").innerHTML = h;
  $("warn").textContent = (last.warnings || []).join("\n");
}

function renderQuests() {
  if (!last) return;
  const name = tuning.markets[tab].name;
  $("qtitle").textContent = `クエストごとの達成時刻 — ${name}(タブで切替)`;
  const m = last.markets.find((x) => x.name === name);
  if (!m) { $("quests").innerHTML = `<p class="err">このマーケットまで届かなかった</p>`; return; }
  const p = prev?.markets.find((x) => x.name === name);
  let h = `<table><tr><th>#</th><th>品×個数</th><th class="num">所要</th><th class="num">累計</th><th class="num">前回の累計</th><th class="num">全体の時刻</th></tr>`;
  for (const q of m.quests) {
    const pq = p?.quests.find((x) => x.n === q.n);
    h += `<tr><td>${q.n}</td><td>${esc(q.item)}×${q.count}</td><td class="num">${mmss(q.dur)}</td><td class="num">${mmss(q.since_start)}</td>` +
      `<td class="num">${pq ? mmss(pq.since_start) : "—"}</td><td class="num">${mmss(q.t)}</td></tr>`;
  }
  if (!m.done) h += `<tr><td colspan="6" class="err">打ち切り(1時間で終わらなかった)</td></tr>`;
  const [c, l] = m.done ? band(m.dur, 6, 9) : ["long", "打ち切り"];
  h += `</table><p>このマーケットの所要 <b>${mmss(m.dur)}</b> <span class="pill ${c}">${l}</span></p>`;
  $("quests").innerHTML = h;
}

function renderChart() {
  const svg = $("chart");
  if (!last) { svg.innerHTML = ""; return; }
  const W = svg.clientWidth || 600, H = svg.clientHeight || 280, L = 56, R = 12, T = 12, B = 28;
  const runs = [prev, last].filter(Boolean);
  const tmax = Math.max(...runs.map((r) => r.total), 60);
  const ymax = Math.max(...runs.flatMap((r) => r.money.map((p) => p.money)), 10) * 1.05;
  const x = (t) => L + (t / tmax) * (W - L - R), y = (v) => H - B - (v / ymax) * (H - T - B);
  let s = "";
  // 目盛り(縦=お金、横=分)
  const ystep = niceStep(ymax / 4);
  for (let v = 0; v <= ymax; v += ystep)
    s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}円</text>`;
  const xstep = Math.max(60, niceStep(tmax / 8 / 60) * 60);
  for (let t = 0; t <= tmax; t += xstep)
    s += `<text x="${x(t)}" y="${H - 8}" text-anchor="middle">${t / 60}分</text>`;
  // マーケットの区切り
  last.markets.forEach((m, i) => {
    if (i > 0) s += `<line x1="${x(m.start)}" x2="${x(m.start)}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
    s += `<text x="${x(m.start) + 4}" y="${T + 10}">${esc(m.name)}</text>`;
  });
  const path = (r) => r.money.map((p, i) => `${i ? "L" : "M"}${x(p.t).toFixed(1)},${y(p.money).toFixed(1)}`).join("");
  if (prev) s += `<path d="${path(prev)}" fill="none" stroke="var(--prev)" stroke-width="2" stroke-dasharray="5 4"/>`;
  s += `<path d="${path(last)}" fill="none" stroke="var(--series)" stroke-width="2"/>`;
  s += `<line id="cross" y1="${T}" y2="${H - B}" stroke="var(--text2)" visibility="hidden"/><circle id="dot" r="4" fill="var(--series)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
  s += `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"/>`;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = s;
  svg.onmousemove = (e) => {
    const rect = svg.getBoundingClientRect();
    const t = ((e.clientX - rect.left - L) / (W - L - R)) * tmax;
    const near = (r) => r && r.money.reduce((a, b) => (Math.abs(b.t - t) < Math.abs(a.t - t) ? b : a));
    const p = near(last), q = near(prev);
    if (!p) return;
    const cross = svg.querySelector("#cross"), dot = svg.querySelector("#dot");
    cross.setAttribute("x1", x(p.t)); cross.setAttribute("x2", x(p.t)); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", x(p.t)); dot.setAttribute("cy", y(p.money)); dot.setAttribute("visibility", "visible");
    const tip = $("tip");
    tip.innerHTML = `${mmss(p.t)} ${esc(last.markets[p.market]?.name || "")}<br>今回 <b>${p.money}円</b>` + (q ? `<br>前回 ${q.money}円` : "");
    tip.style.display = "block"; tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY + 12 + "px";
  };
  svg.onmouseleave = () => { $("tip").style.display = "none"; svg.querySelectorAll("#cross,#dot").forEach((n) => n.setAttribute("visibility", "hidden")); };
}

function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1e-9))));
  for (const k of [1, 2, 5, 10]) if (raw <= k * p) return k * p;
  return 10 * p;
}

function renderResults() { renderSummary(); renderQuests(); renderChart(); }

// tuning を defs の形にそろえる(古い tuning.json に欠けた欄があっても表が崩れないように)
function merge(base, t) {
  const out = clone(base);
  for (const m of out.markets) {
    const tm = t?.markets?.find((x) => x.name === m.name);
    if (!tm) continue;
    const byName = (arr, name) => (arr || []).find((x) => x.name === name);
    m.items.forEach((x) => { const o = byName(tm.items, x.name); if (o?.price != null) x.price = o.price; });
    for (const k of ["sources", "plants"]) m[k].forEach((x) => { const o = byName(tm[k], x.name); if (o?.cost != null) x.cost = o.cost; if (o?.unlock != null) x.unlock = o.unlock; });
    m.quests.forEach((x, i) => { const o = tm.quests?.[i]; if (o?.count != null) x.count = o.count; });
    for (const k of ["road_cost", "farmer_cost", "carrier_cost"]) if (tm[k] != null) m[k] = tm[k];
    if (m.river && tm.river?.cost != null) m.river.cost = tm.river.cost;
  }
  return out;
}

async function run() {
  $("run").disabled = true;
  $("status").textContent = "シミュレーション中…(初回はビルドで数分)";
  try {
    const res = await api("/api/run", tuning);
    prev = last; last = res;
    $("status").textContent = `完了 ${new Date().toLocaleTimeString()}`;
    renderResults();
  } catch (e) {
    $("status").textContent = "失敗";
    $("warn").textContent = e.message;
  } finally {
    $("run").disabled = false;
  }
}

$("run").onclick = run;
$("reset").onclick = () => { tuning = clone(defs); renderEditor(); renderDiff(); $("status").textContent = "初期値に戻した(未実行)"; };
window.addEventListener("resize", renderChart);

(async () => {
  try {
    defs = await api("/api/defs");
    tuning = merge(defs, await api("/api/tuning"));
    const l = await api("/api/last");
    last = l.last; prev = l.prev;
    renderTabs(); renderEditor(); renderDiff(); renderResults();
    $("status").textContent = last ? "前回の結果を表示中" : "準備できた";
  } catch (e) {
    $("status").textContent = "読み込み失敗";
    $("warn").textContent = e.message;
  }
})();
</script>
</body>
</html>
