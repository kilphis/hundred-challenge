<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>ネズミの壁のぼり</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfd8de}canvas{display:block}
#help{position:fixed;left:12px;bottom:10px;color:#fff;font:13px/1.6 "Hiragino Sans",sans-serif;text-shadow:0 1px 3px #000;opacity:.9;pointer-events:none}
#hud{position:fixed;left:12px;top:10px;color:#fff;font:bold 18px "Hiragino Sans",sans-serif;text-shadow:0 1px 4px #000;pointer-events:none}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#fff;font:bold 40px "Hiragino Sans",sans-serif;text-shadow:0 2px 8px #000;pointer-events:none}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="models/mouse.js"></script>
</head><body>
<div id="help">← → / A D: 移動(壁に向かって押すと張りつく)　↑ W / ↓ S: 壁を登る・下りる　Space: ジャンプ(壁からは反対へ跳ぶ)　Shift: ダッシュ　R: やり直し</div>
<div id="hud"></div>
<div id="msg">ゴール!</div>
<script>
// 単位 1 = 1cm。横が x、高さが y。奥行き z は見た目だけ(当たり判定は x,y の2D)
const DBG=new URLSearchParams(location.search);
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(devicePixelRatio);R.setSize(innerWidth,innerHeight);
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0xcfd8de);

// ---- カメラ: 真横から平行投影 ----
const VIEW_H=130; // 画面の縦に映る高さ(cm)
const cam=new THREE.OrthographicCamera(-1,1,1,-1,1,1000);
function resize(){const a=innerWidth/innerHeight;cam.left=-VIEW_H*a/2;cam.right=VIEW_H*a/2;cam.top=VIEW_H/2;cam.bottom=-VIEW_H/2;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);}
addEventListener('resize',resize);resize();

// ---- 光 ----
S.add(new THREE.HemisphereLight(0xffffff,0x8a7a6a,0.75));
const sun=new THREE.DirectionalLight(0xffffff,0.9);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-150,right:150,top:150,bottom:-150,near:1,far:500});
S.add(sun,sun.target);

// ---- ステージ: [左x, 右x, 下y, 上y] の箱。どの箱の側面も登れる ----
const BLOCKS=[
  [-100,400,-40,0],     // 床
  [80,110,0,100],       // 柱1
  [130,250,110,130],    // 棚1
  [220,250,130,260],    // 柱2
  [60,200,265,285],     // 棚2
  [60,90,285,420],      // 柱3
  [110,260,425,445],    // 棚3
  [230,260,445,580],    // 柱4
  [60,210,585,605],     // ゴールの棚
];
const GOAL=[60,210,605]; // この棚の上に立ったらゴール
const X_MIN=-80,X_MAX=380;
const DEPTH=40; // 箱の奥行き(見た目)
const blockMat=new THREE.MeshStandardMaterial({color:0x9c7a58,roughness:0.9});
const topMat=new THREE.MeshStandardMaterial({color:0x6f8f4e,roughness:0.95});
for(const [x0,x1,y0,y1] of BLOCKS){
  const m=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,DEPTH),blockMat);
  m.position.set((x0+x1)/2,(y0+y1)/2,0);m.castShadow=m.receiveShadow=true;S.add(m);
  const t=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,1,DEPTH),topMat);
  t.position.set((x0+x1)/2,y1-0.5,0);t.receiveShadow=true;S.add(t);
}
// ゴールの旗
{const g=new THREE.Group();g.position.set(150,GOAL[2],0);
 const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,40,10),new THREE.MeshStandardMaterial({color:0xdddddd}));pole.position.y=20;pole.castShadow=true;g.add(pole);
 const flag=new THREE.Mesh(new THREE.BoxGeometry(12,8,0.4),new THREE.MeshStandardMaterial({color:0xd94040}));flag.position.set(6,35,0);flag.castShadow=true;g.add(flag);
 S.add(g);}

// ---- ネズミ(rig を z 軸で回すと壁に縦に張りつく) ----
const rig=new THREE.Group();S.add(rig);
const player=window.MODELS.mouse();rig.add(player);
const parts=player.userData.parts;
const HW=6,HH=6; // 当たり判定の半幅・高さ

const P={x:0,y:0,vx:0,vy:0,face:1,yaw:Math.PI/2,onGround:false,coyote:0,buf:0,phase:0,goal:false,
  climb:null,grabLock:0,cl:0,best:0,inv:0};
const START=[0,0];
const WALK=85,DASH=170,ACC=900,FRIC=1100,AIR=0.6;
const G=900,JUMP_V=235,CUT=0.45,MAXFALL=500; // JUMP_V で約30cm
const CLIMB=60,WALLJUMP_VX=110; // 壁を登る速さ(cm/秒)、壁から跳ぶ横の速さ

const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();if(!e.repeat)P.buf=0.12;}if(e.code==='KeyR')reset();});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Space'&&P.vy>0&&!P.climb)P.vy*=CUT;});
function reset(){P.x=START[0];P.y=START[1];P.vx=P.vy=0;P.climb=null;P.goal=false;P.best=0;P.inv=0;document.getElementById('msg').style.display='none';}

function overlap(x,y){for(const b of BLOCKS){if(x+HW>b[0]&&x-HW<b[1]&&y+HH>b[2]&&y<b[3])return b;}return null;}
function setGround(){P.onGround=true;P.coyote=0.1;}

function physics(dt){
  const L=keys.ArrowLeft||keys.KeyA,Rt=keys.ArrowRight||keys.KeyD;
  const up=keys.ArrowUp||keys.KeyW,down=keys.ArrowDown||keys.KeyS;
  const dir=(Rt?1:0)-(L?1:0),max=keys.ShiftLeft||keys.ShiftRight?DASH:WALK;
  P.buf-=dt;P.grabLock-=dt;P.inv-=dt;

  // ---- 壁に張りついている間 ----
  if(P.climb){
    const b=P.climb;
    if(P.buf>0){ // 壁から反対側へ跳ぶ
      P.buf=0;P.climb=null;P.face=-P.face;P.vx=P.face*WALLJUMP_VX;P.vy=JUMP_V*0.9;P.grabLock=0.2;
    }else if(dir===-P.face){ // 離れる
      P.climb=null;P.face=-P.face;P.vx=P.face*30;P.vy=0;P.grabLock=0.2;
    }else{
      const vy=(up||dir===P.face)?CLIMB:down?-CLIMB:0;
      P.vy=vy;P.vx=0;
      let ny=P.y+vy*dt;
      if(vy>0&&overlap(P.x,ny)){ny=P.y;P.vy=0;} // 頭上がふさがっている
      if(vy<0&&overlap(P.x,ny)){ // 足が床についた
        let o=overlap(P.x,ny);ny=o[3];P.climb=null;setGround();
      }
      P.y=ny;
      if(P.climb){
        if(P.y>=b[3]-HH*0.5){ // てっぺんに着いたら上に乗る
          const nx=P.face>0?b[0]+HW+1:b[1]-HW-1;
          if(!overlap(nx,b[3])){P.x=nx;P.y=b[3];P.climb=null;P.vy=0;setGround();}
          else{P.y=b[3]-HH*0.5;P.vy=0;}
        }else if(P.y+HH<=b[2]){P.climb=null;P.vy=0;} // 壁の下端から外れた
      }
      return;
    }
  }

  const k=P.onGround?1:AIR;
  if(dir&&!P.goal){P.vx+=dir*ACC*k*dt;P.vx=Math.max(-max,Math.min(max,P.vx));P.face=dir;}
  else{const f=FRIC*k*dt;P.vx=Math.abs(P.vx)<=f?0:P.vx-Math.sign(P.vx)*f;}
  // ジャンプ(足場を離れて少しの間と、着地直前の入力も受け付ける)
  P.coyote=P.onGround?0.1:P.coyote-dt;
  if(P.buf>0&&P.coyote>0&&!P.goal){P.vy=JUMP_V;P.buf=0;P.coyote=0;P.onGround=false;}
  P.vy=Math.max(-MAXFALL,P.vy-G*dt);
  // x → y の順に動かして押し戻す
  P.x+=P.vx*dt;let b=overlap(P.x,P.y);
  if(b){P.x=P.vx>0?b[0]-HW:b[1]+HW;P.vx=0;}
  P.x=Math.max(X_MIN,Math.min(X_MAX,P.x));
  P.y+=P.vy*dt;b=overlap(P.x,P.y);P.onGround=false;
  if(b){if(P.vy<=0){P.y=b[3];P.onGround=true;}else P.y=b[2]-HH;P.vy=0;}
  else if(P.vy<=0&&overlap(P.x,P.y-0.01)){P.onGround=true;}

  // ---- 壁に張りつく: 向いている側に壁があり、その方向か ↑ を押している ----
  if(!P.goal&&P.grabLock<=0&&(dir===P.face||up)){
    const w=overlap(P.x+P.face*0.5,P.y);
    if(w&&w[3]>P.y+0.5){
      P.climb=w;P.vx=P.vy=0;P.onGround=false;
      P.x=P.face>0?w[0]-HW:w[1]+HW;
    }
  }

  if(!P.goal&&P.onGround&&P.y>=GOAL[2]&&P.x>GOAL[0]&&P.x<GOAL[1]){P.goal=true;document.getElementById('msg').style.display='flex';}
}

// ---- 敵: 甲虫。棚の上を左右に、柱の側面を上下に往復する ----
// top: y の上を x=a〜b で往復 / side: x の面を y=a〜b で往復(wall=+1 は壁が右、-1 は壁が左)
const ENEMY_DEFS=[
  {type:'top',y:130,a:136,b:212,speed:25},
  {type:'side',x:220,wall:1,a:138,b:250,speed:20},
  {type:'top',y:285,a:96,b:194,speed:30},
  {type:'side',x:90,wall:-1,a:292,b:410,speed:25},
  {type:'top',y:445,a:116,b:224,speed:35},
  {type:'side',x:230,wall:1,a:452,b:570,speed:30},
];
const EW=4,ET=3; // 敵の半分の長さ・厚み
function makeBeetle(){
  const T=THREE,g=new T.Group(),inner=new T.Group();g.add(inner); // inner: 頭が +x、お腹が -y
  const shell=new T.MeshPhysicalMaterial({color:0x2a1a12,roughness:0.3,clearcoat:0.8});
  const dark=new T.MeshStandardMaterial({color:0x140c08,roughness:0.6});
  const body=new T.Mesh(new T.SphereGeometry(1,20,14),shell);body.scale.set(3.6,1.8,2.6);body.position.y=2.2;inner.add(body);
  const head=new T.Mesh(new T.SphereGeometry(1.3,14,10),dark);head.position.set(3.6,1.8,0);inner.add(head);
  const eyeM=new T.MeshStandardMaterial({color:0xff3020,emissive:0x801000});
  [1,-1].forEach(s=>{const e=new T.Mesh(new T.SphereGeometry(0.35,8,6),eyeM);e.position.set(4.4,2.2,s*0.7);inner.add(e);
    const an=new T.Mesh(new T.CylinderGeometry(0.07,0.07,3,4),dark);an.position.set(5.6,3,s*0.9);an.rotation.z=-0.9;an.rotation.x=s*0.3;inner.add(an);});
  const legs=[];
  for(let i=0;i<3;i++)[1,-1].forEach(s=>{const p=new T.Group();p.position.set(2-i*2,1.5,s*1.8);
    const l=new T.Mesh(new T.CylinderGeometry(0.15,0.12,3,5),dark);l.position.set(0,-0.8,s*1.0);l.rotation.x=s*1.0;p.add(l);inner.add(p);legs.push([p,i,s]);});
  g.traverse(o=>{if(o.isMesh){o.castShadow=true;}});
  g.userData={inner,legs};return g;
}
const enemies=ENEMY_DEFS.map(d=>{const m=makeBeetle();S.add(m);return {x:0,y:0,...d,t:d.a,dir:1,m};});
function enemyBox(e){
  if(e.type==='top')return [e.x-EW,e.x+EW,e.y,e.y+ET*1.5];
  return e.wall>0?[e.x-ET*1.5,e.x,e.y-EW,e.y+EW]:[e.x,e.x+ET*1.5,e.y-EW,e.y+EW];
}
function mouseBox(){
  if(P.climb){const w=P.x+P.face*HW;return P.face>0?[w-6,w,P.y,P.y+14]:[w,w+6,P.y,P.y+14];}
  return [P.x-HW,P.x+HW,P.y,P.y+HH];
}
function updateEnemies(dt,time){
  for(const e of enemies){
    e.t+=e.dir*e.speed*dt;if(e.t>e.b){e.t=e.b;e.dir=-1}if(e.t<e.a){e.t=e.a;e.dir=1}
    if(e.type==='top'){e.x=e.t;e.m.position.set(e.x,e.y,0);e.m.rotation.z=0;e.m.userData.inner.rotation.y=e.dir>0?0:Math.PI;}
    else{e.y=e.t;e.m.position.set(e.x,e.y,0);e.m.rotation.z=e.wall*Math.PI/2;
      // wall=+1 で頭は +y、-1 で頭は -y。進む向きに頭を合わせる
      e.m.userData.inner.rotation.y=(e.dir*e.wall>0)?0:Math.PI;}
    for(const [p,i,s] of e.m.userData.legs)p.rotation.z=Math.sin(time*18+i*2+(s>0?0:Math.PI))*0.5;
  }
}
// 当たったら、敵と反対側へはじかれて壁から落ちる。少しの間は無敵(点滅)
function hitEnemies(){
  if(P.inv>0||P.goal)return;
  const m=mouseBox();
  for(const e of enemies){const b=enemyBox(e);
    if(m[0]<b[1]&&m[1]>b[0]&&m[2]<b[3]&&m[3]>b[2]){
      const away=Math.sign((m[0]+m[1])/2-(b[0]+b[1])/2)||-P.face;
      P.climb=null;P.onGround=false;P.vx=away*120;P.vy=150;P.grabLock=0.4;P.inv=1.5;return;}
  }
}

// ---- 見た目のアニメ(day17 と同じ動かし方) ----
function animate(t,dt){
  const target=P.face>0?Math.PI/2:-Math.PI/2;
  P.yaw+=(target-P.yaw)*Math.min(1,dt*14);
  P.cl+=((P.climb?1:0)-P.cl)*Math.min(1,dt*16);
  player.rotation.y=P.yaw;
  // 壁にいるときは鼻を上へ、お腹を壁へ。原点(お腹の下)を壁の面に置き、尻が足元に来るよう 7cm 上げる
  rig.rotation.z=P.cl*P.face*Math.PI/2;
  rig.position.set(P.x+P.cl*P.face*HW,P.y+P.cl*7,0);
  const sp=P.climb?Math.abs(P.vy)*1.4:Math.abs(P.vx);P.phase+=dt*sp*0.22;
  const a=Math.min(1,sp/85),s=Math.sin(P.phase);
  const Lg=parts.legs,k=0.7*a;
  Lg.fl.rotation.x=s*k;Lg.br.rotation.x=s*k;Lg.fr.rotation.x=-s*k;Lg.bl.rotation.x=-s*k;
  if(!P.onGround&&!P.climb)for(const l of Object.values(Lg))l.rotation.x=0.5*(l===Lg.fl||l===Lg.fr?1:-1);
  const b=parts.body;b.position.y=(b.userData.y0??(b.userData.y0=b.position.y))+Math.abs(s)*0.4*a*(P.onGround?1:0);
  parts.tail.forEach((g,i)=>{const r=g.userData.r0||(g.userData.r0={x:g.rotation.x,y:g.rotation.y});g.rotation.y=r.y+Math.sin(t*3+i*0.6-P.phase*0.5)*(0.08+0.04*(1-a));g.rotation.x=r.x+0.02*Math.sin(t*2+i);});
  parts.whiskers.rotation.y=Math.sin(t*20)*0.04*(1-a);
  parts.head.rotation.x=Math.sin(t*1.3)*0.05*(1-a);
}

// ---- カメラ追従(上が見えるよう少し上を映す) ----
const camPos={x:0,y:40};
function camUpdate(dt){
  const tx=P.x+P.face*10,ty=Math.max(VIEW_H/2-15,P.y+20);
  camPos.x+=(tx-camPos.x)*Math.min(1,dt*4);camPos.y+=(ty-camPos.y)*Math.min(1,dt*3);
  cam.position.set(camPos.x,camPos.y,200);cam.lookAt(camPos.x,camPos.y,0);
  sun.position.set(camPos.x-40,camPos.y+90,80);sun.target.position.set(camPos.x,camPos.y,0);
}

const hud=document.getElementById('hud');
if(DBG.has('x')){P.x=+DBG.get('x');P.y=+(DBG.get('y')||0);camPos.x=P.x;camPos.y=P.y+20;}
if(DBG.has('hold'))DBG.get('hold').split(',').forEach(c=>keys[c]=true);
if(DBG.has('face'))P.face=+DBG.get('face');
if(DBG.has('climb')){const w=overlap(P.x+P.face*0.5,P.y);if(w){P.climb=w;P.x=P.face>0?w[0]-HW:w[1]+HW;}}
if(DBG.has('jump'))P.buf=0.12;
if(DBG.has('sim'))for(let i=0;i<+DBG.get('sim');i++){physics(1/60);updateEnemies(1/60,i/60);hitEnemies();animate(i/60,1/60);}
let last=performance.now();
function loop(now){
  const dt=Math.max(0,Math.min(0.033,(now-last)/1000));last=now;
  physics(dt);updateEnemies(dt,now/1000);hitEnemies();animate(now/1000,dt);rig.visible=!(P.inv>0&&Math.floor(now/80)%2);camUpdate(dt);
  P.best=Math.max(P.best,P.y);hud.textContent=`高さ ${Math.round(P.y)}cm(最高 ${Math.round(P.best)}cm / ゴール ${GOAL[2]}cm)`;
  if(DBG.has('dbg'))document.title=[P.x,P.y,P.vx,P.vy,+!!P.climb,P.inv].map(v=>(+v).toFixed(1)).join(',');
  R.render(S,cam);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
