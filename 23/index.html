<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>画像解析タスク看板</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2129;--line:#30363d;--fg:#e6edf3;--mut:#8b949e;--acc:#58a6ff;--ok:#3fb950;--warn:#f0883e;--bad:#f85149}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f8fa;--panel:#fff;--panel2:#f0f2f5;--line:#d0d7de;--fg:#1f2328;--mut:#59636e;--acc:#0969da;--ok:#1a7f37;--warn:#bc4c00;--bad:#cf222e}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.65 "Hiragino Sans","Noto Sans JP",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0}
header .sub{color:var(--mut);font-size:12px}
header .sp{flex:1}
main{max-width:1320px;margin:0 auto;padding:18px 20px 60px}
button,select,input[type=number]{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
input[type=number]{width:100px;cursor:text}
button:hover,select:hover{border-color:var(--mut)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.on{outline:2px solid var(--acc)}
input[type=range]{accent-color:var(--acc);vertical-align:middle}
/* 看板 */
.lane{margin:0 0 22px}
.lane h2{font-size:13px;color:var(--mut);margin:0 0 8px;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card .no{font:600 12px ui-monospace,Menlo,monospace;color:var(--mut)}
.card h3{margin:0;font-size:15px}
.card p{margin:0;color:var(--mut);font-size:12.5px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--mut)}
.badge{font-size:11px;padding:1px 8px;border-radius:10px;font-weight:600}
.b-todo{background:var(--panel2);color:var(--mut)}
.b-doing{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.b-clear{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.meta{display:flex;justify-content:space-between;align-items:center}
.lv{color:var(--warn);letter-spacing:1px}
/* 課題画面 */
.task{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
.brief{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto}
.brief h2{font-size:17px;margin:2px 0 6px}
.brief h3{font-size:12px;color:var(--mut);margin:14px 0 4px;letter-spacing:.05em}
.brief p,.brief li{font-size:13px}
.brief ul,.brief ol{padding-left:20px;margin:4px 0}
.goal{border-left:3px solid var(--acc);padding:6px 10px;background:var(--panel2);border-radius:0 6px 6px 0}
details{margin-top:6px;font-size:13px}
details summary{cursor:pointer;color:var(--acc)}
.ans{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.ans label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg{padding:8px 10px;border-radius:6px;font-size:13px;display:none}
.msg.ok{display:block;background:color-mix(in srgb,var(--ok) 15%,transparent);border:1px solid var(--ok)}
.msg.ng{display:block;background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid var(--bad)}
.ws{display:flex;flex-direction:column;gap:12px;min-width:0}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.pane h4{margin:0 0 8px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
.figs{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.fig{display:flex;flex-direction:column;gap:4px;min-width:0}
.fig span{font-size:12px;color:var(--mut)}
canvas{max-width:100%;height:auto;display:block;border-radius:6px;background:#000}
canvas.px{image-rendering:pixelated}
.pane canvas:not(.chart){max-width:min(100%,420px)}
canvas.chart{background:var(--panel2);width:100%}
.stat{font:600 15px ui-monospace,Menlo,monospace}
.mut{color:var(--mut);font-size:12px}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
table{border-collapse:collapse;font-size:12.5px}
td,th{border-bottom:1px solid var(--line);padding:3px 8px;text-align:right}
@media (max-width:900px){.task{grid-template-columns:1fr}.brief{position:static;max-height:none}main{padding:12px 16px 40px}}
</style>
<script src="lab.js"></script>
</head><body>
<header>
  <h1 id="title">画像解析タスク看板</h1>
  <span class="sub" id="sub"></span>
  <span class="sp"></span>
  <button id="back" style="display:none">← 看板にもどる</button>
</header>
<main id="main"></main>
<script src="app.js"></script>
</body></html>
